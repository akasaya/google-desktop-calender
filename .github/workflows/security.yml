name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked --dev --group security
      - run: uv run python scripts/check_security.py
      - run: uv run --group security bandit -r src scripts
      - run: uv run --group security python scripts/audit_dependencies.py
